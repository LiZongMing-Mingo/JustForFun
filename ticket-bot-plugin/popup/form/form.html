<fieldset>
    <legend>抢票信息</legend>
    <div class="form-row">
        <label for="concert-id">演唱会ID:</label>
        <input type="text" id="concert-id" name="concert-id" placeholder="Enter Concert ID" required>
        <small style="display: block; color: #666; margin-top: 4px; font-size: 12px;">
            在购票主页网址中，查看URL最后面的数字，就是演唱会ID
        </small>
    </div>
    <div class="form-row">
        <label for="user-id">CustomID:</label>
        <input type="text" id="user-id" name="user-id" placeholder="Enter your User ID (e.g., N20250703003241bf4)">
        <small style="display: block; color: #666; margin-top: 4px; font-size: 12px;">
            在购票主页网址，右键-查看网页源代码-cfg.customId的那一串字符串复制过来。EG:N202506251XXXXXXXX
        </small>
    </div>
    <div class="form-row-half">
        <div class="form-col">
            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required>
        </div>
        <div class="form-col">
            <label for="time">Time:</label>
            <input type="time" id="time" name="time" required>
        </div>
    </div>
    <div class="form-row">
        <label for="section">目标区块列表:</label>
        <input type="text" id="section" name="section" placeholder="Enter block numbers (e.g., 25,26,27)" required>
        <small style="display: block; color: #666; margin-top: 4px; font-size: 12px;">
            输入你想要的区块,用英文逗号分隔。例如:25,26 或 A,B,C (MelonTicket支持字母区块)
        </small>
    </div>
    <div class="form-row">
        <label for="row-numbers">目标排号列表 (可选):</label>
        <input type="text" id="row-numbers" name="row-numbers" placeholder="Enter row numbers (e.g., 1,2,3 or 10-15)">
        <small style="display: block; color: #666; margin-top: 4px; font-size: 12px;">
            输入你想要的排号,用英文逗号分隔。例如:1,2,3 或 10-15 (表示10到15排)。留空则搜索所有排
        </small>
    </div>
</fieldset>
